<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <title>LUMO Companion</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="./icons/icon48.png" alt="LUMO" />
        <span>LUMO</span>
      </div>
      <div class="header-actions">
        <span id="conn-status" class="status-pill">Checking...</span>
        <button type="button" id="open-options-btn" class="icon-btn" title="Extension Settings">Settings</button>
      </div>
    </header>

    <section class="card" aria-label="Current page">
      <div id="page-title" class="page-title">Loading active tab...</div>
      <div id="page-url" class="page-url"></div>
      <div id="saved-badge" class="badge">Checking workspace...</div>
    </section>

    <section class="card" aria-label="Save to workspace">
      <div class="field">
        <label for="collection-select">Collection</label>
        <select id="collection-select" class="select">
          <option value="">No collection</option>
        </select>
      </div>
      <div class="field">
        <label for="tags-input">Tags (comma-separated)</label>
        <input id="tags-input" type="text" class="input" placeholder="research, python, reading" />
      </div>
      <div class="field">
        <label for="note-input">Note (optional)</label>
        <textarea id="note-input" class="textarea" placeholder="Add a personal note..."></textarea>
      </div>
      <div class="btn-row">
        <button type="button" id="save-page-btn" class="btn btn--primary">Save Page</button>
        <button type="button" id="save-selection-btn" class="btn" disabled>Save Selection</button>
        <button type="button" id="open-lumo-btn" class="btn">Open in LUMO</button>
      </div>
      <div id="save-feedback" class="feedback"></div>
    </section>

    <section class="card" aria-label="Search workspace">
      <form id="search-form" class="btn-row">
        <input id="search-input" type="search" class="input" style="flex: 1;" placeholder="Search your LUMO workspace..." />
        <button type="submit" class="btn" style="flex: 0 0 auto;">Search</button>
      </form>
      <div id="search-results" class="search-results"></div>
    </section>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
