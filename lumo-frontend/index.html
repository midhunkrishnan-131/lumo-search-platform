<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMO — Independent Search &amp; Intelligence</title>
    <meta
      name="description"
      content="LUMO is an independent search, research, and web security intelligence platform. Simple on the surface. Powerful underneath."
    />
    <meta property="og:title" content="LUMO — Independent Search &amp; Intelligence" />
    <meta
      property="og:description"
      content="Discover information, investigate complex questions, and explore the internet more safely with LUMO."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('lumo_theme_preference') || 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme-preference', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/themes.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header id="lumo-header"></header>

    <main id="main-content" class="page-main">
      <div class="home-stage">
        <section class="hero-search-zone" aria-labelledby="home-headline">
          <div class="hero-greeting-row">
            <span id="home-greeting">Welcome</span>
            <span aria-hidden="true">·</span>
            <time id="home-date" class="tabular-nums"></time>
          </div>

          <h1 id="home-headline" class="hero-headline">What will you discover today?</h1>
          <p class="hero-subtitle">
            Explore something new. Find the answers you're looking for.
          </p>

          <div class="search-form-wrap">
            <form id="home-search-form" role="search" aria-label="LUMO Search" novalidate>
              <div class="search-box">
                <svg
                  class="search-box__icon"
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="9" cy="9" r="5.75" />
                  <path d="m16.5 16.5-3.4-3.4" />
                </svg>

                <label for="home-search-input" class="sr-only">Search LUMO</label>
                <input
                  id="home-search-input"
                  class="search-box__input"
                  type="search"
                  name="q"
                  autocomplete="off"
                  spellcheck="true"
                  placeholder="Search the web, concepts, or technical topics..."
                  role="combobox"
                  aria-autocomplete="list"
                  aria-expanded="false"
                  aria-controls="home-suggestions"
                />

                <button
                  type="button"
                  id="home-search-clear"
                  class="search-box__clear"
                  aria-label="Clear search query"
                  hidden
                >
                  <svg
                    width="15"
                    height="15"
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    aria-hidden="true"
                  >
                    <path d="M4 4l8 8M12 4l-8 8" />
                  </svg>
                </button>

                <button type="submit" class="search-box__submit">Search</button>
              </div>

              <div
                id="home-suggestions"
                class="suggestions-panel"
                role="listbox"
                aria-label="Search suggestions"
                hidden
              ></div>
            </form>

            <div
              id="home-search-feedback"
              class="search-feedback"
              role="status"
              aria-live="polite"
            ></div>
          </div>

          <div class="mode-selector-wrap">
            <div class="segmented-control" role="group" aria-label="Search mode">
              <button
                type="button"
                class="segmented-control__btn"
                data-search-mode="classic"
                aria-pressed="false"
              >
                Classic
              </button>
              <button
                type="button"
                class="segmented-control__btn"
                data-search-mode="semantic"
                aria-pressed="false"
              >
                Semantic
              </button>
              <button
                type="button"
                class="segmented-control__btn"
                data-search-mode="hybrid"
                aria-pressed="true"
              >
                Hybrid
              </button>
            </div>
            <p id="home-mode-description" class="mode-description"></p>
          </div>

          <div id="home-quick-prompts" class="quick-prompts" aria-label="Suggested searches">
            <span>Try:</span>
            <button
              type="button"
              class="quick-prompt-btn"
              data-quick-query="how search engines work"
            >
              How search engines work
            </button>
            <span aria-hidden="true">·</span>
            <button
              type="button"
              class="quick-prompt-btn"
              data-quick-query="TLS cryptography web security"
            >
              TLS web security
            </button>
            <span aria-hidden="true">·</span>
            <button
              type="button"
              class="quick-prompt-btn"
              data-quick-query="knowledge graph entity relationships"
            >
              Knowledge graphs
            </button>
            <span aria-hidden="true">·</span>
            <button
              type="button"
              class="quick-prompt-btn"
              data-quick-query="URL security redirect chain inspection"
            >
              URL security analysis
            </button>
          </div>
        </section>

        <section class="daily-section" aria-labelledby="daily-section-heading">
          <div class="daily-section-header">
            <h2 id="daily-section-heading" class="daily-section-title">Daily Discovery</h2>
            <span id="daily-source-meta" class="daily-section-meta"></span>
          </div>

          <div class="daily-grid">
            <article class="daily-cell" aria-labelledby="daily-special-title">
              <div class="daily-kicker">
                <span class="daily-kicker__label">Today's Special Day</span>
                <span id="daily-special-kind"></span>
              </div>
              <h3 id="daily-special-title" class="daily-cell__title"></h3>
              <p id="daily-special-desc" class="daily-cell__body"></p>
              <p id="daily-special-why" class="daily-cell__detail"></p>
              <div class="daily-action-row">
                <span id="daily-special-date" class="daily-section-meta tabular-nums"></span>
              </div>
            </article>

            <article class="daily-cell" aria-label="Daily Inspiration">
              <div class="daily-kicker">
                <span class="daily-kicker__label">Daily Inspiration</span>
                <span>Verified Quote</span>
              </div>
              <blockquote id="daily-quote-text" class="daily-quote"></blockquote>
              <div class="daily-action-row">
                <cite id="daily-quote-author" class="daily-quote-author"></cite>
              </div>
            </article>

            <article class="daily-cell" aria-labelledby="daily-dyk-title">
              <div class="daily-kicker">
                <span class="daily-kicker__label">Did You Know?</span>
                <span id="daily-dyk-category"></span>
              </div>
              <h3 id="daily-dyk-title" class="daily-cell__title"></h3>
              <p id="daily-dyk-fact" class="daily-cell__body"></p>
            </article>

            <article class="daily-cell" aria-labelledby="daily-discovery-title">
              <div class="daily-kicker">
                <span class="daily-kicker__label">Daily Discovery</span>
                <span>Featured Topic</span>
              </div>
              <h3 id="daily-discovery-title" class="daily-cell__title"></h3>
              <p id="daily-discovery-summary" class="daily-cell__body"></p>
              <div class="daily-action-row">
                <a id="daily-discovery-explore" href="./results.html" class="text-link">
                  Explore topic
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M3.5 8h9M8.5 4l4 4-4 4" />
                  </svg>
                </a>
              </div>
            </article>
          </div>
        </section>
      </div>
    </main>

    <footer id="lumo-footer"></footer>
    <script type="module" src="./js/home.js"></script>
  </body>
</html>
